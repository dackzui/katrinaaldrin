<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katrina & Aldrin - Our Wedding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#home">Katrina & Aldrin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="attend.html">Attend</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero" id="home">
    <div class="hero-content">
      <p class="text-uppercase fw-bold">We are getting married</p>
      <h1 class="hero-title mb-3">
        <span class="invite-names">
          <span class="invite-name">Katrina</span>
          <span class="invite-amp">&</span>
          <span class="invite-name">Aldrin</span>
        </span>
      </h1>
      <p class="lead mb-4">May 23, 2027 · Shangri-La Mactan</p>
      <div class="countdown" aria-label="Countdown to May 23, 2027">
        <div class="count-box">
          <div class="count-number" id="count-days">--</div>
          <div class="count-label">Days</div>
        </div>
        <div class="count-box">
          <div class="count-number" id="count-hours">--</div>
          <div class="count-label">Hours</div>
        </div>
        <div class="count-box">
          <div class="count-number" id="count-mins">--</div>
          <div class="count-label">Minutes</div>
        </div>
        <div class="count-box">
          <div class="count-number" id="count-secs">--</div>
          <div class="count-label">Seconds</div>
        </div>
      </div>
      <div class="mt-4 hero-actions">
        <a class="btn btn-lg btn-light me-2" href="attend.html">Attend</a>
      </div>
    </div>
  </header>

  <footer class="footer py-4">
    <div class="container d-flex flex-column flex-lg-row align-items-center justify-content-between">
      <div>With love, Katrina & Aldrin</div>
      <div class="small text-white-50">May 23, 2027 · Shangri-La Mactan</div>
      <div class="small text-white-50">Website by: <a class="text-white" href="https://apellanes.com.au" target="_blank" rel="noreferrer">apellanes.com.au</a></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    (function() {
      const target = new Date("2027-05-23T15:30:00").getTime();
      const daysEl = document.getElementById("count-days");
      const hoursEl = document.getElementById("count-hours");
      const minsEl = document.getElementById("count-mins");
      const secsEl = document.getElementById("count-secs");

      function updateCountdown() {
        const now = Date.now();
        const diff = Math.max(target - now, 0);
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / (1000 * 60)) % 60);
        const secs = Math.floor((diff / 1000) % 60);

        daysEl.textContent = days.toString().padStart(2, "0");
        hoursEl.textContent = hours.toString().padStart(2, "0");
        minsEl.textContent = mins.toString().padStart(2, "0");
        secsEl.textContent = secs.toString().padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
